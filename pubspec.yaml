name: mando_virtual
description: "Convierte tu teléfono en mando/volante virtual para Linux mediante Wi-Fi y uinput."
publish_to: "none"
version: 0.4.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: 2.4.5
  sensors_plus: 7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Audiowide
      fonts:
        - asset: fonts/Audiowide-Regular.ttf
    - family: Rajdhani
      fonts:
        - asset: fonts/Rajdhani-Bold.ttf
    - family: ShareTechMono
      fonts:
        - asset: fonts/ShareTechMono-Regular.ttf
