name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Generar proyecto Android completo
        run: flutter create --platforms=android --project-name mando_virtual .

      - name: Parchear manifiesto (red, cleartext y nombre)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          # Los permisos deben ir justo despues de <manifest> y antes de <application>
          perms = ''
          for name in ('INTERNET', 'WAKE_LOCK', 'VIBRATE'):
              if 'android.permission.' + name not in s:
                  perms += '    <uses-permission android:name="android.permission.%s"/>\n' % name
          if perms:
              s = re.sub(r'(<manifest[^>]*>\s*)', lambda m: m.group(1) + perms, s, count=1)

          # Nombre visible en el launcher
          s = re.sub(r'android:label="[^"]*"', 'android:label="Mando Virtual"', s, count=1)

          # Necesario para ws:// en la LAN (Android 9+ bloquea trafico claro)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)

          open(p, 'w', encoding='utf-8').write(s)
          print('Manifiesto parcheado correctamente')
          PY
          grep -E 'INTERNET|usesCleartextTraffic|android:label' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código (solo errores)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Compilar APK release
        run: flutter build apk --release --split-per-abi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mando-virtual-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
